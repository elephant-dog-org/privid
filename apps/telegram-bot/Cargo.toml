[package]
name = "privid-telegram-bot"
version = "0.1.0"
edition = "2021"
authors = ["PrivID Team"]
description = "Privacy-respecting identity verification Telegram bot using Holonym"

[dependencies]
teloxide = { version = "0.17.0", features = ["macros"] }
tokio = { version = "1.0", features = ["full", "fs"] }
log = "0.4"
env_logger = "0.11.8"
dotenv = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12.22", features = [
    "json",
    "rustls-tls-native-roots",
] }
anyhow = "1.0"
thiserror = "2.0.12"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9.1"
async-trait = "0.1"
tiny-keccak = { version = "2.0", features = ["keccak"] }
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-rusqlite = "0.6"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
