version: '3.8'

services:
  privid-telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: privid-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      # Optional: Mount logs directory if you want to persist logs
      - ./logs:/app/logs
    # Optional: Add healthcheck
    healthcheck:
      test: ["CMD", "pgrep", "-f", "privid-telegram-bot"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s 