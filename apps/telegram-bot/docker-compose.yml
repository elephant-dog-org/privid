version: '3.8'

services:
  privid-telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: privid-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - RUST_LOG=${RUST_LOG:-info}
      # Real Holonym SBT reads on Optimism by default; set "mock" in .env for dev.
      - VERIFICATION_MODE=${VERIFICATION_MODE:-blockchain}
      # Inside the container the API must bind all interfaces to be reachable.
      - API_BIND=0.0.0.0
    volumes:
      # SQLite registry + challenges live here (Database::new("data/privid.db")).
      # Without this mount every container restart wiped all registrations.
      - ./data:/app/data
      # Optional: Mount logs directory if you want to persist logs
      - ./logs:/app/logs
    # Optional: Add healthcheck
    healthcheck:
      test: ["CMD", "pgrep", "-f", "privid-telegram-bot"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s 